<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rscaps studio</title>
    <script>
      // Theme decision before first paint (avoid light/dark flash).
      try {
        const t = localStorage.getItem("rscaps:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        else if (t === "system")
          document.documentElement.dataset.theme = matchMedia(
            "(prefers-color-scheme: light)",
          ).matches
            ? "light"
            : "dark";
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "@fframes/editor": "/nm/@fframes/editor/dist/fframes-editor.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
