<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>rscaps studio</title>
    <script>
      // Theme decision before first paint (mirrors tscaps: inline in index.html).
      try {
        const t = localStorage.getItem("rscaps:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      /* ── Design tokens (dark / light) ─────────────────────────────── */
      :root,
      [data-theme="dark"] {
        --surface-0: 8 8 11;
        --surface-1: 17 17 21;
        --surface-2: 24 24 32;
        --surface-3: 36 36 46;

        --edge-tint: 200 200 224;
        --edge-faint: 0.116;
        --edge-subtle: 0.163;
        --edge-medium: 0.273;
        --edge-strong: 0.437;

        --fg-primary: 245 245 245;
        --fg-secondary: 204 204 204;
        --fg-muted: 161 161 161;
        --fg-faint: 130 130 138;
        --fg-on-accent: 255 255 255;

        --accent: 91 123 230;
        --accent-hover: 117 145 238;
        --danger: 248 113 113;
        --warning: 234 179 8;
        --info: 117 145 238;

        --scene-1: 120 180 186;
        --scene-2: 120 148 186;
        --scene-3: 126 120 186;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.45);
        --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      [data-theme="light"] {
        --surface-0: 250 248 244;
        --surface-1: 244 241 235;
        --surface-2: 234 230 221;
        --surface-3: 219 213 201;

        --edge-tint: 48 32 0;
        --edge-faint: 0.094;
        --edge-subtle: 0.126;
        --edge-medium: 0.224;
        --edge-strong: 0.443;

        --fg-primary: 28 25 22;
        --fg-secondary: 64 58 51;
        --fg-muted: 90 84 75;
        --fg-faint: 110 100 87;
        --fg-on-accent: 255 255 255;

        --accent: 47 77 199;
        --accent-hover: 36 62 168;
        --danger: 185 28 28;
        --warning: 161 98 7;
        --info: 47 77 199;

        --scene-1: 43 81 84;
        --scene-2: 66 92 128;
        --scene-3: 114 108 178;

        --shadow-sm: 0 1px 2px rgba(80, 70, 50, 0.06);
        --shadow-md: 0 4px 12px rgba(80, 70, 50, 0.1);
        --shadow-raised: 0 1px 2px rgba(80, 70, 50, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      :root {
        --edge-faint-c: rgb(var(--edge-tint) / var(--edge-faint));
        --edge-subtle-c: rgb(var(--edge-tint) / var(--edge-subtle));
        --edge-medium-c: rgb(var(--edge-tint) / var(--edge-medium));
        --edge-strong-c: rgb(var(--edge-tint) / var(--edge-strong));
        --motion-quick: 150ms;
        --ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1);
        --r-xs: 4px;
        --r-sm: 6px;
        --r-md: 8px;
        --r-lg: 12px;
        --font-sans: "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* ── Base ─────────────────────────────────────────────────────── */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--font-sans);
        letter-spacing: -0.011em;
        background: rgb(var(--surface-0));
        color: rgb(var(--fg-primary));
        overflow: hidden;
        transition: background-color var(--motion-quick) var(--ease-standard);
      }
      ::selection { background: rgb(var(--accent) / 0.25); }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: none; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      :focus-visible { outline: none; }
      svg { display: block; }

      .app { height: 100dvh; display: flex; flex-direction: column; }

      /* ── Toolbar ──────────────────────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 10px;
        margin: 4px 12px 0;
        border-bottom: 1px solid var(--edge-subtle-c);
        shrink: 0;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid transparent;
        border-radius: var(--r-xs);
        color: rgb(var(--fg-secondary));
        transition: color var(--motion-quick) var(--ease-standard),
          background-color var(--motion-quick) var(--ease-standard),
          border-color var(--motion-quick) var(--ease-standard);
      }
      .icon-btn:not(:disabled):hover {
        background: rgb(var(--surface-2));
        border-color: var(--edge-medium-c);
        color: rgb(var(--fg-primary));
      }
      .icon-btn:focus-visible { border-color: rgb(var(--accent)); }
      .name-input {
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--r-xs);
        color: rgb(var(--fg-primary));
        font-size: 15px;
        font-weight: 500;
        padding: 5px 8px;
        min-width: 120px;
        max-width: 320px;
        transition: background-color var(--motion-quick) var(--ease-standard),
          border-color var(--motion-quick) var(--ease-standard);
      }
      .name-input:hover { background: rgb(var(--surface-2)); border-color: var(--edge-medium-c); }
      .name-input:focus { background: rgb(var(--surface-2)); border-color: rgb(var(--accent)); }
      .spacer { flex: 1; }
      .toolbar-group { display: flex; gap: 2px; }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: rgb(var(--fg-muted));
        background: rgb(var(--surface-2));
        border: 1px solid var(--edge-subtle-c);
        border-radius: 999px;
        padding: 3px 10px;
        max-width: 480px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgb(var(--info));
        flex: none;
      }
      .status-pill.error {
        color: rgb(var(--danger));
        border-color: rgb(var(--danger) / 0.4);
        background: rgb(var(--danger) / 0.08);
      }
      .status-pill.error::before { background: rgb(var(--danger)); }
      .status-pill.ready::before { background: rgb(var(--scene-1)); }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 500;
        color: rgb(var(--fg-primary));
        background: rgb(var(--surface-2));
        border: 1px solid var(--edge-medium-c);
        border-radius: var(--r-xs);
        transition: background-color var(--motion-quick) var(--ease-standard),
          border-color var(--motion-quick) var(--ease-standard);
      }
      .btn:not(:disabled):hover { background: rgb(var(--surface-3)); border-color: rgb(var(--accent)); }
      .btn:focus-visible { border-color: rgb(var(--accent)); }
      .btn.accent {
        background: rgb(var(--accent));
        border-color: rgb(var(--accent));
        color: rgb(var(--fg-on-accent));
      }
      .btn.accent:not(:disabled):hover { background: rgb(var(--accent-hover)); border-color: rgb(var(--accent-hover)); }

      /* ── Editor split (left preview / right sidebar) ──────────────── */
      .editor {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 7fr) 12px minmax(280px, 3fr);
        padding: 12px 16px 16px;
        gap: 0;
      }
      .resize-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: col-resize;
        touch-action: none;
      }
      .resize-handle span {
        width: 2px;
        height: 40px;
        border-radius: 999px;
        background: var(--edge-subtle-c);
        transition: background-color var(--motion-quick) var(--ease-standard);
      }
      .resize-handle:hover span { background: var(--edge-strong-c); }
      .resize-handle.dragging span { background: rgb(var(--accent)); }

      /* ── Left: preview column ─────────────────────────────────────── */
      .preview-col {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        container-type: size;
        padding-right: 12px;
      }
      .video-box {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: calc(100cqh - var(--controls-h, 210px));
        max-width: calc((100cqh - var(--controls-h, 210px)) * 16 / 9);
        background: rgb(var(--surface-1));
        border-radius: var(--r-lg);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        flex: none;
      }
      .stage {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(45deg, rgb(var(--surface-2)) 25%, transparent 25%, transparent 75%, rgb(var(--surface-2)) 75%),
          linear-gradient(45deg, rgb(var(--surface-2)) 25%, rgb(var(--surface-1)) 25%, rgb(var(--surface-1)) 75%, rgb(var(--surface-2)) 75%);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      .stage svg { width: 100%; height: 100%; display: block; pointer-events: none; }
      .stage-chip {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        font-family: var(--font-mono);
        color: rgb(var(--fg-faint));
        background: rgb(var(--surface-0) / 0.55);
        padding: 2px 7px;
        border-radius: var(--r-pill, 999px);
        pointer-events: none;
      }

      /* Playback controls */
      .playbar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgb(var(--surface-1));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        padding: 8px 12px;
        flex: none;
      }
      .play-btn {
        width: 34px;
        height: 34px;
        border-radius: var(--r-sm);
        background: rgb(var(--surface-3));
        border: 1px solid var(--edge-medium-c);
        color: rgb(var(--fg-primary));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .play-btn:hover { border-color: rgb(var(--accent)); }
      .play-btn .icon-pause { display: none; }
      .play-btn[data-playing="true"] .icon-play { display: none; }
      .play-btn[data-playing="true"] .icon-pause { display: block; }

      .time-display {
        font-family: var(--font-mono);
        font-size: 12px;
        color: rgb(var(--fg-secondary));
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .time-display.muted { color: rgb(var(--fg-faint)); }

      input[type="range"].scrub {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 4px;
        border-radius: 999px;
        background: rgb(var(--surface-3));
        outline: none;
        min-width: 80px;
      }
      input[type="range"].scrub::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: rgb(var(--fg-primary));
        border: none;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
      }
      input[type="range"].scrub:focus-visible::-webkit-slider-thumb { background: rgb(var(--accent)); }

      .playbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
      .frame-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: rgb(var(--fg-muted));
      }
      .frame-field input {
        width: 74px;
        background: rgb(var(--surface-0));
        border: 1px solid var(--edge-medium-c);
        border-radius: var(--r-xs);
        padding: 5px 7px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: rgb(var(--fg-primary));
      }
      .frame-field input:focus { border-color: rgb(var(--accent)); }

      /* Raster compare strip + filmstrip */
      .compare-strip {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(180px, 240px) 1fr;
        gap: 12px;
        flex: none;
      }
      figure { margin: 0; min-width: 0; }
      .compare .stage {
        position: relative;
        inset: auto;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        overflow: hidden;
        background: rgb(var(--surface-1));
      }
      .compare .stage canvas { width: 100%; height: 100%; display: block; }
      figcaption {
        font-size: 11px;
        color: rgb(var(--fg-faint));
        text-align: center;
        margin-top: 4px;
        font-family: var(--font-mono);
      }
      .thumbs { display: flex; gap: 8px; min-width: 0; overflow-x: auto; }
      .thumbs figure { flex: 1; min-width: 90px; }
      .thumbs .stage {
        position: relative;
        inset: auto;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-sm);
        overflow: hidden;
        background: rgb(var(--surface-1));
      }

      /* ── Right: sidebar ───────────────────────────────────────────── */
      .sidebar {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-left: 12px;
      }
      .mode-strip {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: rgb(var(--surface-1));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        flex: none;
      }
      .mode-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: var(--r-sm);
        font-size: 13px;
        font-weight: 500;
        color: rgb(var(--fg-muted));
        transition: color var(--motion-quick) var(--ease-standard),
          background-color var(--motion-quick) var(--ease-standard);
      }
      .mode-tab:hover { background: rgb(var(--surface-2)); color: rgb(var(--fg-secondary)); }
      .mode-tab.active {
        color: rgb(var(--accent));
        background: rgb(var(--surface-3));
        box-shadow: var(--shadow-raised);
      }
      .mode-tab.tool { font-size: 11px; padding: 6px 8px; color: rgb(var(--fg-faint)); font-weight: 400; }
      .mode-tab.tool.active { color: rgb(var(--accent)); }
      .mode-divider { width: 1px; height: 16px; background: var(--edge-subtle-c); margin: 0 2px; flex: none; }
      .mode-strip .flex-1 { flex: 1; }

      .mode-panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mode-panel[hidden] { display: none; }

      .subtab-strip {
        display: flex;
        gap: 2px;
        padding: 4px;
        background: rgb(var(--surface-1));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        overflow-x: auto;
        flex: none;
        scrollbar-width: none;
      }
      .subtab-strip::-webkit-scrollbar { display: none; }
      .thumbs { scrollbar-width: thin; scrollbar-color: rgb(var(--surface-3)) transparent; }
      .thumbs::-webkit-scrollbar { height: 6px; }
      .thumbs::-webkit-scrollbar-track { background: transparent; }
      .thumbs::-webkit-scrollbar-thumb { background: rgb(var(--surface-3)); border-radius: 999px; }
      .subtab {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 6px 8px;
        min-width: 56px;
        border-radius: var(--r-sm);
        font-size: 10.5px;
        color: rgb(var(--fg-muted));
        transition: color var(--motion-quick) var(--ease-standard),
          background-color var(--motion-quick) var(--ease-standard);
      }
      .subtab:hover { background: rgb(var(--surface-2)); color: rgb(var(--fg-secondary)); }
      .subtab.active {
        color: rgb(var(--accent));
        background: rgb(var(--surface-3));
        box-shadow: var(--shadow-raised);
      }

      .subpanel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .subpanel[hidden] { display: none; }
      .subpanel label {
        font-size: 12px;
        font-weight: 500;
        color: rgb(var(--fg-muted));
        display: block;
        margin-bottom: 6px;
      }
      textarea#doc {
        flex: 1;
        min-height: 120px;
        width: 100%;
        resize: none;
        background: rgb(var(--surface-0));
        color: rgb(var(--fg-secondary));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-sm);
        font: 12px/1.55 var(--font-mono);
        padding: 10px;
        tab-size: 2;
      }
      textarea#doc:focus { border-color: rgb(var(--accent)); }
      .panel-actions { display: flex; gap: 8px; }
      .placeholder-note {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
        color: rgb(var(--fg-faint));
        background: rgb(var(--surface-1));
        border: 1px dashed var(--edge-medium-c);
        border-radius: var(--r-md);
        padding: 20px;
        line-height: 1.6;
      }
      .template-picker {
        background: rgb(var(--surface-1));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        padding: 12px;
      }
      .template-picker select {
        width: 100%;
        background: rgb(var(--surface-0));
        color: rgb(var(--fg-secondary));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-sm);
        font: 13px/1.5 var(--font-ui, inherit);
        padding: 8px 10px;
      }
      .template-picker select:focus { border-color: rgb(var(--accent)); }

      /* Timeline mode */
      .timeline {
        position: relative;
        flex: 1;
        min-height: 0;
        background: rgb(var(--surface-1));
        border: 1px solid var(--edge-subtle-c);
        border-radius: var(--r-md);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .timeline-ruler {
        position: relative;
        height: 26px;
        border-bottom: 1px solid var(--edge-faint-c);
        flex: none;
        overflow: hidden;
      }
      .timeline-tick {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px solid var(--edge-faint-c);
        font-size: 10px;
        font-family: var(--font-mono);
        color: rgb(var(--fg-faint));
        padding: 5px 0 0 4px;
        user-select: none;
      }
      .timeline-lane {
        position: relative;
        flex: 1;
        margin: 10px;
      }
      .cue-chip {
        position: absolute;
        top: 14px;
        height: 46px;
        border-radius: var(--r-sm);
        border: 1px solid rgb(var(--edge-tint) / var(--edge-medium));
        font-size: 11px;
        color: rgb(var(--fg-secondary));
        overflow: hidden;
        padding: 5px 7px;
        cursor: pointer;
        white-space: nowrap;
        text-overflow: ellipsis;
        transition: filter var(--motion-quick) var(--ease-standard);
        direction: auto;
        text-align: left;
      }
      .cue-chip:hover { filter: brightness(1.15); }
      .cue-chip.active { border-color: rgb(var(--accent)); box-shadow: 0 0 0 1px rgb(var(--accent)); }
      .cue-chip:nth-child(3n + 1) { background: rgb(var(--scene-1) / 0.22); }
      .cue-chip:nth-child(3n + 2) { background: rgb(var(--scene-2) / 0.22); }
      .cue-chip:nth-child(3n + 3) { background: rgb(var(--scene-3) / 0.22); }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgb(var(--accent));
        pointer-events: none;
        z-index: 2;
      }
      .playhead::before {
        content: "";
        position: absolute;
        top: 0;
        left: -3.5px;
        width: 8px;
        height: 8px;
        background: rgb(var(--accent));
        border-radius: 2px;
      }

      @media (max-width: 900px) {
        .editor { grid-template-columns: minmax(0, 1fr); }
        .resize-handle { display: none; }
        .sidebar { padding-left: 0; }
        .compare-strip { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Toolbar -->
      <header class="toolbar">
        <button class="icon-btn" id="back" title="Back to projects" aria-label="Back" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <input class="name-input" id="project-name" value="Untitled" aria-label="Project name" />
        <div class="toolbar-group">
          <button class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 3 7l3 3" /><path d="M3 7h6.5A3.5 3.5 0 0 1 13 10.5v0A3.5 3.5 0 0 1 9.5 14H7" /></svg>
          </button>
          <button class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4l3 3-3 3" /><path d="M13 7H6.5A3.5 3.5 0 0 0 3 10.5v0A3.5 3.5 0 0 0 6.5 14H9" /></svg>
          </button>
        </div>
        <div class="spacer"></div>
        <span id="status" class="status-pill">loading…</span>
        <div class="toolbar-group">
          <button class="btn" id="import-subtitle" title="Import captions from a .srt or .vtt file">Import</button>
          <button class="btn" id="export-srt" title="Download captions as SubRip (.srt)">.srt</button>
          <button class="btn" id="export-vtt" title="Download captions as WebVTT (.vtt)">.vtt</button>
        </div>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none" /></svg>
        </button>
        <button class="btn" id="save" disabled>Save</button>
        <button class="btn accent" id="export" title="Download current frame as PNG">Export</button>
      </header>

      <!-- Subtitle file picker (Import toolbar button triggers it) -->
      <input type="file" id="subtitle-file" accept=".srt,.vtt,application/x-subrip,text/vtt" hidden />

      <!-- Editor: preview + sidebar -->
      <div class="editor" id="editor">
        <section class="preview-col" id="preview-col">
          <div class="video-box">
            <div id="stage" class="stage"></div>
            <span id="stage-caption" class="stage-chip">frame —</span>
          </div>

          <div class="playbar">
            <button id="play" class="play-btn" data-playing="false" title="Play / Pause (Space)" aria-label="Play">
              <svg class="icon-play" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2.4v9.2l7.2-4.6z" /></svg>
              <svg class="icon-pause" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2.5" width="3" height="9" rx="1" /><rect x="8" y="2.5" width="3" height="9" rx="1" /></svg>
            </button>
            <span class="time-display" id="time-display">00:00.00</span>
            <input type="range" class="scrub" id="scrub" min="0" step="1" value="10" aria-label="Seek" />
            <span class="time-display muted" id="duration-display">00:00.00</span>
            <div class="playbar-right">
              <label class="frame-field">frame <input id="frame" type="number" min="0" value="10" /></label>
              <button class="btn" id="render">Render</button>
              <button class="btn" id="raster">Raster</button>
            </div>
          </div>

          <div class="compare-strip">
            <figure class="compare">
              <div id="raster-stage" class="stage"></div>
              <figcaption id="raster-caption">raster —</figcaption>
            </figure>
            <div class="thumbs" id="thumbs"></div>
          </div>
        </section>

        <div class="resize-handle" id="resize-handle" title="Drag to resize"><span></span></div>

        <aside class="sidebar">
          <!-- Mode strip: content tab + divider + tool tab -->
          <div class="mode-strip" role="tablist" aria-label="Editor mode">
            <button class="mode-tab active" data-mode="captions" role="tab">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3.5" width="12" height="9" rx="2" /><path d="M4.5 9.5h3M9.5 9.5h2M4.5 7h5" /></svg>
              Captions
            </button>
            <span class="flex-1"></span>
            <span class="mode-divider" aria-hidden="true"></span>
            <button class="mode-tab tool" data-mode="timeline" role="tab">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 8h2l1.5-4 2 8 2-6 1.5 3H14" /></svg>
              Timeline
            </button>
          </div>

          <!-- Captions panel -->
          <div class="mode-panel" data-panel="captions">
            <div class="subtab-strip" role="tablist" aria-label="Captions sections">
              <button class="subtab" data-sub="templates" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" /><rect x="9" y="2.5" width="4.5" height="4.5" rx="1" /><rect x="2.5" y="9" width="4.5" height="4.5" rx="1" /><rect x="9" y="9" width="4.5" height="4.5" rx="1" /></svg>Templates</button>
              <button class="subtab" data-sub="transcript" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3.5" width="12" height="9" rx="2" /><path d="M4.5 8.5h3M9 8.5h2.5M4.5 10.7h5" /></svg>Transcript</button>
              <button class="subtab" data-sub="typography" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4h10M8 4v8M6 12h4" /></svg>Type</button>
              <button class="subtab" data-sub="style" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5" /><circle cx="6" cy="6.5" r="1" fill="currentColor" stroke="none" /><circle cx="10" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg>Style</button>
              <button class="subtab" data-sub="position" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v12M2 8h12M8 2l-2 2M8 2l2 2M8 14l-2-2M8 14l2-2M2 8l2-2M2 8l2 2M14 8l-2-2M14 8l-2 2" /></svg>Position</button>
              <button class="subtab" data-sub="motion" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2" /><ellipse cx="8" cy="8" rx="6" ry="2.8" transform="rotate(-24 8 8)" /></svg>Motion</button>
              <button class="subtab" data-sub="effects" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 2.5l1.4 3.6L13 7.5l-3.6 1.4L8 12.5 6.6 8.9 3 7.5l3.6-1.4z" /></svg>Effects</button>
              <button class="subtab" data-sub="layout" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4h10M3 7h7M3 10h9M3 13h5" /></svg>Layout</button>
              <button class="subtab active" data-sub="code" role="tab"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5 2.5 8l3 3.5M10.5 4.5 13.5 8l-3 3.5" /></svg>Code</button>
            </div>

            <!-- Code panel: the spike's document editor -->
            <div class="subpanel" data-subpanel="code">
              <div>
                <label for="doc">document (JSON)</label>
                <textarea id="doc" spellcheck="false"></textarea>
              </div>
              <div class="panel-actions">
                <button class="btn accent" id="apply">Apply + prepare</button>
              </div>
            </div>

            <!-- Placeholder for not-yet-built panels -->
            <div class="subpanel" data-subpanel="placeholder" hidden>
              <div class="template-picker" id="template-picker" hidden>
                <label for="template-select">Template</label>
                <select id="template-select">
                  <option value="">Default (v0)</option>
                  <option value="ada">Ada</option>
                  <option value="anya">Anya</option>
                  <option value="cleo">Cleo</option>
                  <option value="elio">Elio</option>
                  <option value="enzo">Enzo</option>
                  <option value="ezra">Ezra</option>
                  <option value="freya">Freya</option>
                  <option value="hugo">Hugo</option>
                  <option value="iris">Iris</option>
                  <option value="ivo">Ivo</option>
                  <option value="juno">Juno</option>
                  <option value="kai">Kai</option>
                  <option value="kel">Kel</option>
                  <option value="lena">Lena</option>
                  <option value="levi">Levi</option>
                  <option value="lewis">Lewis</option>
                  <option value="loki">Loki</option>
                  <option value="luca">Luca</option>
                  <option value="luna">Luna</option>
                  <option value="lyra">Lyra</option>
                  <option value="milo">Milo</option>
                  <option value="mira">Mira</option>
                  <option value="naya">Naya</option>
                  <option value="noor">Noor</option>
                  <option value="nova">Nova</option>
                  <option value="nyx">Nyx</option>
                  <option value="otto">Otto</option>
                  <option value="pastor">Pastor</option>
                  <option value="pepper">Pepper</option>
                  <option value="pico">Pico</option>
                  <option value="remi">Remi</option>
                  <option value="rhea">Rhea</option>
                  <option value="sara">Sara</option>
                  <option value="selene">Selene</option>
                  <option value="sol">Sol</option>
                  <option value="tala">Tala</option>
                  <option value="theo">Theo</option>
                  <option value="tito">Tito</option>
                  <option value="vera">Vera</option>
                  <option value="yuki">Yuki</option>
                  <option value="zara">Zara</option>
                </select>
              </div>
              <div class="placeholder-note" id="placeholder-note">—</div>
            </div>
          </div>

          <!-- Timeline panel (tool mode) -->
          <div class="mode-panel" data-panel="timeline" hidden>
            <div class="timeline" id="timeline">
              <div class="timeline-ruler" id="timeline-ruler"></div>
              <div class="timeline-lane" id="timeline-lane">
                <div class="playhead" id="playhead" style="left: 0"></div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@fframes/editor": "/nm/@fframes/editor/dist/fframes-editor.js"
        }
      }
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
