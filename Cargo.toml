[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# Fork ort-web (backend wasm) — jangan jadi member; dipakai lewat [patch].
exclude = ["crates/ort-web-local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
# "3" bukan "s": loop raster per-piksel (svgr/tiny-skia/usvgr, burn-in)
# melambat ~20-50x dengan opt-level "s" (cold render cleo 150ms -> ~4ms).
# lto "thin" (bukan "true"): lto penuh memicu rustc ICE di crate exr.
opt-level = 3
lto = "thin"

# Fork ort-web: stub SetSessionGraphOptimizationLevel/AddSessionConfigEntry
# upstream no-op → opt level & config entry tak pernah sampai ke
# onnxruntime-web (fp16 crash ORT #26717). Fork ini mengisinya.
[patch.crates-io]
ort-web = { path = "crates/ort-web-local" }
