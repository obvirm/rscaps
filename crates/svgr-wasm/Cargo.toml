[package]
name = "svgr-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bridge svgr (usvgr+tiny-skia) ke WASM: raster SVG caption di WASM, bukan canvas browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# svgr = usvgr (parse SVG) + tiny-skia (raster). Default features memakai
# system-fonts/memmap-fonts yang butuh std::fs - matikan untuk wasm.
svgr = { version = "0.50", default-features = false, features = ["text"] }
wasm-bindgen = "0.2.100"
# ahash (via usvgr) pulls getrandom 0.3; wasm needs its wasm_js backend.
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
