<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- fframes-editor-controller (wasm_audio.rs) declares
         #[wasm_bindgen(module = "@fframes/editor")] -> wasm-bindgen emits a
         bare-specifier import in the app glue. Trunk has no bundler/import
         resolution, so map it to the same 1-line shim caption-bridge's node
         glue uses (pkg is bundler-free). Registered before any module
         script. -->
    <script type="importmap">
      {
        "imports": {
          "@fframes/editor": "./fframes-editor-shim.mjs"
        }
      }
    </script>
    <!-- Fase 3: publish the standalone whisper module for src/wasm_mods.rs.
         Module scripts run in order, so this resolves before the trunk app
         script below boots. -->
    <script type="module">
      import whisperInit, * as whisper from "./whisper_spike.js";
      await whisperInit();
      globalThis.__rscaps_whisper = whisper;
    </script>
    <link data-trunk rel="rust" />
    <!-- whisper base model files, served for real transcription (the engine
         itself is compiled INTO the single app wasm as a Rust dependency). -->
    <link data-trunk rel="copy-file" href="../../models/whisper-base/encoder_model.onnx" />
    <link data-trunk rel="copy-file" href="../../models/whisper-base/decoder_model_merged.onnx" />
    <link data-trunk rel="copy-file" href="../../models/whisper-base/tokenizer.json" />
    <!-- Fase 3: standalone whisper pkg (engine no longer compiled in). -->
    <link data-trunk rel="copy-file" href="../../crates/whisper-spike/pkg/whisper_spike.js" />
    <link data-trunk rel="copy-file" href="../../crates/whisper-spike/pkg/whisper_spike_bg.wasm" />
    <!-- Shim for the @fframes/editor import map above (see comment). -->
    <link data-trunk rel="copy-file" href="../../crates/caption-bridge/pkg/fframes-editor-shim.mjs" />
    <!-- Font sistem utk family default dokumen ("Arial Black"/"Arial") -
         paritas vite.config.ts main: fontRoot = C:\Windows\Fonts. fframes
         editor TIDAK bisa pakai font sistem (text_break_lines returns None),
         jadi file TTF-nya wajib di-ingest + di-@font-face-kan (mesin lokal
         sama-sama punya lisensinya via Windows; tak di-commit). -->
    <link data-trunk rel="copy-file" href="C:/Windows/Fonts/ariblk.ttf" />
    <link data-trunk rel="copy-file" href="C:/Windows/Fonts/arial.ttf" />
    <!-- onnxruntime-web dist for whisper init(): flat in dist root so the
         entry script + wrapper + wasm resolve as siblings (13 MB total,
         not the full 128 MB dist dir). -->
    <link data-trunk rel="copy-file" href="../../node_modules/onnxruntime-web/dist/ort.min.js" />
    <link data-trunk rel="copy-file" href="../../node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs" />
    <link data-trunk rel="copy-file" href="../../node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm" />
    <link data-trunk rel="copy-file" href="../../node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.mjs" />
    <link data-trunk rel="copy-file" href="../../node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.wasm" />
    <!-- Template TTFs (caption-core/assets, Fontsource OFL + Komika Axis
         licensed) served for runtime Slint font registration (padanan
         ingest_font + @font-face main): dist/assets/*.ttf -->
    <link data-trunk rel="copy-dir" href="../../crates/caption-core/assets" />
    <title>rscaps</title>
    <script>
      /* winit on the web never returns from EventLoop::run(): it schedules
         the loop, then throws a JS exception to break out of Rust. That
         surfaces as an unhandled rejection from the wasm init promise
         AFTER the app is already running. Filter this one known message
         so the console stays clean (the exception is control flow). */
      (function () {
        var mark = "Using exceptions for control flow";
        var isWinit = function (v) {
          return String((v && v.message) || v || "").indexOf(mark) !== -1;
        };
        addEventListener("unhandledrejection", function (e) {
          if (isWinit(e.reason)) e.preventDefault();
        });
        addEventListener(
          "error",
          function (e) {
            if (isWinit(e.error || e.message)) e.preventDefault();
          },
          true
        );
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c0e;
        overflow: hidden;
      }
      /* Boot splash (tscaps parity): pure CSS, no JS for visibility.
         Sits ABOVE the canvas while booting; Rust adds .boot-splash--done
         once Slint has drawn its first frames, fading it out to reveal
         the app. The entrance is tscaps's one-shot caption-paint (the
         accent sweeps across "caps") plus the blinking working dot. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0c0e;
        color: #e8e8ea;
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: -0.04em;
        user-select: none;
        pointer-events: none;
        opacity: 1;
        transition: opacity 380ms ease;
      }
      .boot-splash--done {
        opacity: 0;
        visibility: hidden;
        transition: opacity 380ms ease, visibility 0s linear 380ms;
      }
      .boot-splash__accent {
        color: #e85d3c;
        animation: boot-caption-paint 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes boot-caption-paint {
        from {
          color: #e8e8ea;
        }
        to {
          color: #e85d3c;
        }
      }
      .boot-splash__dot {
        color: #e85d3c;
        margin-left: 1px;
        animation: boot-splash-dot-blink 1.4s ease-in-out infinite;
      }
      @keyframes boot-splash-dot-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      #canvas {
        position: relative;
        z-index: 1;
        display: block;
        /* Pinned to the viewport so winit's inline px (stale in windowed
           mode) can never shrink the box. Backing-store attrs are kept in
           sync from Rust via MutationObserver — see sync_canvas_dpr. */
        width: 100vw !important;
        height: 100vh !important;
        outline: none;
      }
      /* DOM video preview (Opsi A2): plays behind the transparent Slint
         canvas at the stage-card rect computed by Rust (sync_video_rect).
         Caption overlay stays on the Slint canvas (svgr raster) so the
         caption engine is unified with export. The video element carries
         the card chrome (border/shadow/radius) via CSS so the Slint card
         can be a transparent hole in the canvas. */
      #preview-video {
        position: absolute;
        z-index: 0;
        display: none;
        object-fit: contain;
        border-radius: 12px; /* Theme.rLg */
        border: 1px solid #26262b; /* border-dark */
        box-shadow: 0 3px 12px rgba(20, 20, 22, 0.95);
        background: #0c0c0e; /* bg0-dark */
        pointer-events: none;
      }
      body.theme-light #preview-video {
        border-color: #e4e2dc; /* border-light */
        box-shadow: 0 3px 12px rgba(60, 50, 40, 0.6);
        background: #f5f5f3; /* bg0-light */
      }
    </style>
  </head>
  <body>
    <div class="boot-splash" role="status" aria-label="Loading">
      <span class="boot-splash__mark">
        <span>rs</span><span class="boot-splash__accent">caps</span><span class="boot-splash__dot">.</span>
      </span>
    </div>
    <canvas id="canvas"></canvas>
  </body>
</html>
