[package]
name = "transcribe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
whisper-spike = { path = "../whisper-spike" }
serde_json = "1"

[features]
default = ["gpu-cuda"]
gpu-directml = ["whisper-spike/gpu-directml"]
gpu-cuda = ["whisper-spike/gpu-cuda"]
gpu-webgpu = ["whisper-spike/gpu-webgpu"]
# DML full (GPU meter lebih tinggi) + fallback CUDA bila hasil repetitif
gpu-boost = ["whisper-spike/gpu-cuda", "whisper-spike/gpu-directml"]
