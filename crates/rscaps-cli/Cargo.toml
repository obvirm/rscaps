[package]
name = "rscaps-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "rscaps headless caption engine — render frame, konversi subtitle, API server"

[[bin]]
name = "rscaps"
path = "src/main.rs"

[dependencies]
caption-core = { path = "../caption-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
svgr = "0.46"
fframes = { version = "1.2.1-rc.38", default-features = false }
axum = "0.8"
fframes_skia_renderer = { version = "1.2.1-rc.38", optional = true, features = ["vulkan"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }

[features]
default = []
# HW-accel FFmpeg (fitur fframes-media) untuk jalur decode/encode headless —
# pilih sesuai hardware saat BUILD, mis.:
#   cargo build --release -p rscaps-cli --features gpu-nvidia
# Raster SVG tetap usvgr/tiny-skia (CPU, deterministik; preview studio
# memakai engine yang sama → output konsisten).
gpu-skia = ["dep:fframes_skia_renderer"]
gpu-nvidia = ["fframes/nvidia"]
gpu-qsv = ["fframes/qsv"]
gpu-vaapi = ["fframes/vaapi"]
gpu-vulkan = ["fframes/vulkan"]
gpu-videotoolbox = ["fframes/videotoolbox"]
