[package]
name = "whisper-spike"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    # api-22+ enables Outlet::make_value_info → SetSymbolicDimensions, which
    # ort-web does not implement (falls to stub "Unimplemented" → panic).
    # ort-web and ort-candle both only require api-17.
    "api-17",
    "alternative-backend",
] }
ndarray = "0.17"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Force-enable the wasm_js backend feature: .cargo/config.toml passes
# --cfg getrandom_backend="wasm_js" for wasm32 builds (rayon/candle graph needs it).
getrandom = { version = "0.3", features = ["wasm_js"] }

# Native/desktop backend: pure Rust (candle), proven working with whisper-tiny.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort-candle = "0.4.1"

# Browser backend: bridges to onnxruntime-web (separate Emscripten wasm module).
# ort-candle/ort-tract do NOT compile on wasm32 (ort-sys declares async
# CreateSession/CreateSessionFromArray there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ort-web = "0.3.0"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[features]
default = []

