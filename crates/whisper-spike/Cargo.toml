[package]
name = "whisper-spike"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
whisper-core = { path = "../whisper-core" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "api-17",
] }
ndarray = "0.17"
wasm-bindgen = "0.2"
js-sys = "0.3"
rustfft = "6"
serde_json = "1"
# Force-enable the wasm_js backend feature: .cargo/config.toml passes
# --cfg getrandom_backend="wasm_js" for wasm32 builds (rayon/candle graph needs it).
getrandom = { version = "0.3", features = ["wasm_js"] }
# Pure-Rust zlib for the HF compression-ratio fallback gate (no C deps →
# wasm32-safe). Used to flag degenerate repetitive attempts (ratio > 2.4).
miniz_oxide = "0.8"

# Native/desktop backend: ORT penuh (onnxruntime prebuilt) — runtime SAMA
# dengan jalur web (quants + opt-level + graph identik). candle-onnx
# (ort-candle) TIDAK dipakai: fp16 graph menghasilkan decode tak sehat
# (instant-EOS/garbage di audio yang di ORT sempurna) dan ops int8/q4
# (DynamicQuantizeLinear/MatMulInteger/MatMulNBits) ditolak (uji 2026-11-15).
# ort-candle dulu "proven tiny" hanya untuk smoke ONNX fp32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
] }

# Browser backend: bridges to onnxruntime-web (separate Emscripten wasm module).
# ort-candle/ort-tract do NOT compile on wasm32 (ort-sys declares async
# CreateSession/CreateSessionFromArray there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ort-web = "0.3.0"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
# ort-web backend untuk wasm: jalur ort rc.13 memerlukan alternative-backend.
[target.'cfg(target_arch = "wasm32")'.dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["alternative-backend"]
web-sys = { version = "0.3", features = ["console"] }

[features]
default = []
# Native DirectML EP (Windows, prebuilt ort-sys +directml) — prototipe GPU.
gpu-directml = ["ort/directml"]
# Native CUDA EP (NVIDIA) — prototipe GPU.
gpu-cuda = ["ort/cuda"]
# Native WebGPU EP dengan backend Dawn Vulkan — prototipe Vulkan.
gpu-webgpu = ["ort/webgpu"]
